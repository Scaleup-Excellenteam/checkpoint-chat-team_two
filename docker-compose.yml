name: checkpoint-chat

services:
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\ntry:\n urllib.request.urlopen('http://localhost:8090/health', timeout=2)\n print('ok')\nexcept Exception as e:\n print(e); sys.exit(1)\nPY"]
      interval: 5s
      timeout: 3s
      retries: 20

  client:
    build: ./client
    stdin_open: true
    tty: true
    environment:
      SERVER_URL: ws://server:8090/ws
    depends_on:
      server:
        condition: service_healthy

  