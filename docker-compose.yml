version: "3.9"

services:
  server:
    build: ./server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 20

  client:
    build: ./client              # Dockerfile שמריץ interactive_client.py
    stdin_open: true             # אינטראקטיבי
    tty: true
    environment:
      SERVER_URL: ws://server:8080/ws
    depends_on:
      server:
        condition: service_healthy
