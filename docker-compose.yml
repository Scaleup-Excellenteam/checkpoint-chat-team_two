services:
  server:
    build: ./server
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health'); print('ok')\""]
      interval: 5s
      timeout: 2s
      retries: 20

  client:
    build: ./client              # Dockerfile שמריץ interactive_client.py
    stdin_open: true             # אינטראקטיבי
    tty: true
    environment:
      SERVER_URL: ws://server:8090/ws
    depends_on:
      server:
        condition: service_healthy
