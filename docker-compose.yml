services:
  server:
    build: ./server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\ntry:\n urllib.request.urlopen('http://localhost:8080/health', timeout=2)\n print('ok')\nexcept Exception as e:\n print(e); sys.exit(1)\nPY"]
      interval: 5s
      timeout: 3s
      retries: 20

  client:
    build: ./client
    stdin_open: true
    tty: true
    environment:
      SERVER_URL: ws://server:8080/ws
    depends_on:
      server:
        condition: service_healthy
